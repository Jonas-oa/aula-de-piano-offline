name: Verificar aplicativo

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir pacote neural offline
        run: npm run check:neural

      - name: Testes unitários e de integração
        run: npm test

      - name: Impedir cascata de harmônicos
        run: npm run check:cascade

      - name: Validar sintaxe dos módulos
        run: |
          find src -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Instalar Chromium para a simulação móvel
        run: npx playwright install --with-deps chromium

      - name: Simular estudo em celular horizontal
        run: npm run test:e2e
